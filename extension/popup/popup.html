<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>NOL 취소표 알리미</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon32.png" alt="" width="20" height="20">
    <h1>NOL 취소표 알리미</h1>
  </header>

  <section>
    <dl id="summary">
      <dt>대상 공연</dt><dd id="targets">-</dd>
      <dt>알림</dt><dd id="channels">-</dd>
    </dl>
  </section>

  <section>
    <h2>감시 중인 탭</h2>
    <ul id="tabs"><li class="muted">불러오는 중…</li></ul>
  </section>

  <div class="actions">
    <button id="test" type="button">알림 테스트</button>
    <button id="options" type="button" class="secondary">설정 열기</button>
  </div>
  <p id="result" class="muted" role="status"></p>

  <p class="note">좌석 클릭·선택완료·결제는 직접 하셔야 합니다.</p>

  <script src="../shared/format.js"></script>
  <script src="popup.js"></script>
</body>
</html>
